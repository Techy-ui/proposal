<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ValentineProposal</title>
    <link rel="stylesheet" href="dashboard.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Hand+Pre:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dekko&display=swap" rel="stylesheet">

</head>
<body>

<header class="navbar">
    <h2><img src="https://techy-ui.github.io/proposal/Frontend/logo.png" alt="logo" style="height:30px;vertical-align:middle;"> ValentineProposal</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main class="dashboard">
    <h1>Welcome, <span id="username">User</span> 💖</h1>
    <p>Create, manage, and relive your magical Valentine proposals.</p>

    <div class="cards">
        <div class="card">
            <h3>Create Proposal</h3>
            <p>Craft a beautiful Valentine proposal for your loved one.</p>
            <button>Create</button>
        </div>

        <div class="card">
            <h3>My Proposals</h3>
            <p>View and manage your saved proposals.</p>
            <button>View</button>
        </div>

        <div class="card account">
            <h3>Account</h3>
            <p>Manage your profile and preferences.</p>
            <button>Settings</button>
        </div>
    </div>
</main>

<script src="dashboard.js"></script>
</body>
</html>
